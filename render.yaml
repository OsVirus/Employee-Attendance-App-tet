services:
  - type: web
    name: employee-attendance-api
    runtime: python
    rootDir: backend
    buildCommand: ""
    startCommand: "python server.py"
    envVars:
      - key: FIELDMARK_ADMIN_PASSWORD
        sync: false
      - key: FIELDMARK_ALLOWED_ORIGIN
        sync: false
      - key: FIELDMARK_OFFICE_LAT
        value: "29.9719381"
      - key: FIELDMARK_OFFICE_LNG
        value: "31.1574611"
      - key: FIELDMARK_GEOFENCE_METERS
        value: "1000"
      - key: FIELDMARK_MAX_ACCURACY
        value: "50"
